[project]
name = "trading-bot"
version = "0.1.0"
description = "Paper momentum long/short trading bot for Alpaca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "fastapi>=0.119.0",
    "openai>=3.42.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.37.0",
]

[project.scripts]
trading-bot = "trading_bot:main"
trading-dashboard = "trading_bot.web.app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
