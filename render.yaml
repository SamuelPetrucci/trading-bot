services:
  - type: web
    name: trading-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AUTO_START
        value: "true"
      - key: ALPACA_PAPER_TRADE
        value: "true"
      - key: DRY_RUN
        value: "false"
      - key: DASHBOARD_HOST
        value: "0.0.0.0"
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: LLM_MODEL
        value: "qwen/qwen3.8-27b"
      - key: LLM_MAX_TOKENS
        value: "400"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
